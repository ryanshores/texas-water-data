name: TexasWater
options:
  bundleIdPrefix: com.ryanshores
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
packages:
  TexasWaterCore:
    path: Packages/TexasWaterCore
targets:
  TexasWater:
    type: application
    platform: iOS
    sources:
      - TexasWaterApp
    dependencies:
      - package: TexasWaterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanshores.TexasWater
        PRODUCT_NAME: Texas Water
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Texas Water
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
