name: TexasWater
options:
  bundleIdPrefix: com.ryanshores
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
packages:
  TexasWaterCore:
    path: Packages/TexasWaterCore
targets:
  TexasWater:
    type: application
    platform: iOS
    productName: Texas Water
    sources:
      - TexasWaterApp
      - Shared
    dependencies:
      - package: TexasWaterCore
      - target: TexasWaterWidget
        embed: true
    entitlements:
      path: TexasWaterApp/TexasWater.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanshores.TexasWater
        PRODUCT_NAME: Texas Water
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Texas Water
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77H7V8G86J
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_TEXAS_WATER_API_BASE_URL: ""
    scheme:
      testTargets: []
  TexasWaterWidget:
    type: app-extension
    platform: iOS
    productName: Texas Water Widget
    sources:
      - TexasWaterWidget
      - Shared
    dependencies:
      - package: TexasWaterCore
    entitlements:
      path: TexasWaterWidget/TexasWaterWidget.entitlements
    info:
      path: TexasWaterWidget/Info.plist
      properties:
        CFBundleDisplayName: Texas Water
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanshores.TexasWater.Widget
        PRODUCT_NAME: Texas Water Widget
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 77H7V8G86J
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
